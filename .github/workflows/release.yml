name: release (approval gated)
# Generated by Rimworld-Release-Admin/scripts/bootstrap-release.sh from scripts/templates/release.yml.
#
# semantic-release computes the version from the commits since the last tag, so this workflow adds what
# the manual publish workflow has: the commit and the version are inputs, the run stops when the branch
# head is not the commit that was asked for or when semantic-release computes another version, and the
# dry-run prints the lines scripts/dispatch-publish.sh looks for. Publish it with:
#   bash /c/Users/nelim/Documents/rimworld/Rimworld-Release-Admin/scripts/dispatch-publish.sh <owner/repo> release.yml <40-character SHA> <version>
# after a successful dry-run with the same commit and version. Only the owner approves steam-production.
"on":
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to release. Publish needs the full 40-character SHA of the head of the release branch (the dry-run summary prints it); the run stops if the branch moved.
        required: true
        default: main
      version:
        description: Version semantic-release must compute from the commits since the last tag, without the v. The run stops if it computes another one.
        required: true
      mode:
        description: Dry-run is safe. Publish requires steam-production approval.
        required: true
        default: dry-run
        type: choice
        options: [dry-run, publish]
concurrency:
  group: steam-publish
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ inputs.mode == 'publish' && 'steam-production' || 'release-dry-run' }}
    permissions:
      contents: write
    env:
      REF: ${{ inputs.ref }}
      VERSION: ${{ inputs.version }}
      # Read by release-steam-plugin.mjs in documented mode: the version semantic-release must lead to.
      RELEASE_VERSION: ${{ inputs.version }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: Validate the inputs
        shell: bash
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must look like 1.2.3, got '$VERSION'" >&2; exit 1; }
          [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "ref contains characters that are not allowed: '$REF'" >&2; exit 1; }
          # The approval gate comes before this job starts, so a branch name could move while the run waits.
          if [[ "$MODE" == publish && ! "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "publish needs a full 40-character commit SHA as ref (the dry-run summary prints it), got '$REF'" >&2; exit 1
          fi
      # The branch the run was dispatched on, at its head: semantic-release refuses a detached older commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin the commit
        id: pin
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          if [[ "$REF" =~ ^[0-9a-f]{40}$ && "$sha" != "$REF" ]]; then
            echo "the branch head is $sha, not $REF: it moved since the dry-run. Run a new dry-run of $sha." >&2; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Rebuild the exact Workshop directory
        run: dotnet build Source/ArchitectStudio.csproj -c Release --nologo
      # The project writes its assembly into Mod/, over the committed one. A build made on the runner is not the
      # build that was tested: on 2026-09-25 the runner's DLL of a mod differed from the committed, tested one
      # (same source, same reference assemblies). So the differences are reported, and then the tracked files are
      # put back: what ships is what is committed. Files the build creates and Git does not track are kept.
      - name: Compare the rebuilt Mod/ with the tracked one, then ship the tracked one
        shell: bash
        run: |
          changed="$(git diff --name-only -- Mod)"
          if [[ -z "$changed" ]]; then
            echo "The build reproduces the tracked Mod/ byte for byte." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::The runner's build differs from the tracked Mod/: the committed files ship, not the rebuilt ones."
            {
              echo "The runner's build differs from the tracked files below. The committed (tested) ones ship, the rebuilt ones are discarded:"
              while IFS= read -r file; do echo "- $file: committed $(git show "HEAD:$file" | sha256sum | cut -d' ' -f1), rebuilt $(sha256sum "$file" | cut -d' ' -f1)"; done <<<"$changed"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            git checkout -- Mod
          fi
      # Kept from the previous workflow of this repository (not in the shared template): it runs after the
      # step above so it validates the files that ship, the committed ones.
      - name: Validate the exact Workshop directory
        run: pwsh ./Tests/Validate-Mod.ps1
      # The plugin skips the Steam steps unless STEAM_PUBLISH is true, so this needs no credential. It
      # also prints the whole Steam description that would replace the page.
      - name: Calculate the release only (no tag, GitHub release, or Steam upload)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release --dry-run 2>&1 | tee "$RUNNER_TEMP/release.log"
          next="$(sed -n 's/.*[Tt]he next release version is \([0-9][0-9.]*\).*/\1/p' "$RUNNER_TEMP/release.log" | tail -1)"
          [[ -n "$next" ]] || { echo "semantic-release would publish nothing: no feat:/fix: commit since the last tag" >&2; exit 1; }
          [[ "$next" == "$VERSION" ]] || { echo "semantic-release computes $next, not $VERSION: give it the version it computes, or fix the commits" >&2; exit 1; }
          echo "Publishing ${{ steps.pin.outputs.sha }} as version $VERSION"
          echo "Commit ${{ steps.pin.outputs.sha }}, version $VERSION, mode $MODE. To publish exactly this commit, dispatch with ref=${{ steps.pin.outputs.sha }} and version=$VERSION." >> "$GITHUB_STEP_SUMMARY"
      - name: Dry-run summary
        if: inputs.mode == 'dry-run'
        run: |
          echo "DRY RUN: nothing was sent to Steam."
      # semantic-release-steam neither installs SteamCMD nor places config.vdf: this action does,
      # and exports STEAMCMD_PATH and STEAM_CONFIG_VDF (a path, not the secret) for the plugin.
      # Pinned to a commit because the tag moves on every release and the action receives the session.
      - name: Steam login
        if: inputs.mode == 'publish'
        uses: RimWorks/mod-ci/.github/actions/steam-login@931aff082d97c7746323da89c840e370f7001915 # v1.10
        with:
          steam-username: ${{ secrets.STEAM_USERNAME }}
          steam-config-vdf-b64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
      - name: Publish after protected-environment approval
        if: inputs.mode == 'publish'
        env:
          STEAM_PUBLISH: 'true'
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
